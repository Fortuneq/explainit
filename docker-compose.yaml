version: "3.9"

services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: explainitsimple
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ./app
    container_name: explainitsimple_app
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/explainitsimple
    command: >
      sh -c "python db/init_db.py && python main.py"
    restart: always

  bot:
    build:
      context: ./bot
    container_name: explainitsimple_bot
    depends_on:
      - app
    restart: always

volumes:
  pgdata:
